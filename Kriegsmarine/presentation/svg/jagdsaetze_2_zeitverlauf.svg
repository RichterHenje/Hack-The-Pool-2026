<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 298" width="640" height="298" role="img">
<title>Jagdsätze pro Monat</title>
<style>
  text { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; }
  .col { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; fill: #586b7c; }
  .src { fill: none; stroke: #9db0bf; stroke-width: 1.5; }
  .step { fill: #dfe9f0; stroke: none; }
  .sep { stroke: #9db0bf; stroke-width: 1; }
  .out { fill: #14283b; }
  .review { fill: none; stroke: #a8680f; stroke-width: 1.5; stroke-dasharray: 6 4; }
  .t { font-size: 13px; font-weight: 600; fill: #14283b; }
  .s { font-size: 11px; font-weight: 400; fill: #586b7c; }
  .t-out { font-size: 13px; font-weight: 600; fill: #f2f5f7; }
  .s-out { font-size: 11px; font-weight: 400; fill: #f2f5f7; opacity: 0.8; }
  .t-rev { font-size: 12px; font-weight: 600; fill: #a8680f; }
  .flow { fill: none; stroke: #14283b; stroke-width: 1.4; }
  .sea { fill: #f2f5f7; }
  .land { fill: #c4d3de; stroke: none; }
  .route { fill: none; stroke: #a8680f; stroke-width: 1.6; stroke-linejoin: round; }
  .dot circle { fill: #14283b; }
  .frame { fill: none; stroke: #14283b; stroke-width: 1.5; }
  .lab { font-size: 13px; fill: #14283b; }
  .val { font-size: 12px; font-weight: 600; fill: #14283b; }
  .tick { font-size: 11px; fill: #586b7c; }
  .bar, .data { fill: #1f5c8a; }
  .empty { fill: #e6edf2; }
  .grid { stroke: #d3dde5; stroke-width: 1; }
  .axis { stroke: #586b7c; stroke-width: 1; }
  .cell { font-size: 12px; font-weight: 600; fill: #14283b; }
  .cellon { font-size: 12px; font-weight: 600; fill: #f2f5f7; }
</style>
<rect width="640" height="298" fill="#f2f5f7" />
<text x="20" y="30" style="font-family:Georgia,serif;font-size:20px;font-weight:600;fill:#14283b">Jagdsätze pro Monat</text>
<g transform="translate(0 48)">
<line class="axis" x1="36" x2="632" y1="214.0" y2="214.0" /><text class="tick" x="30" y="218.0" text-anchor="end">0</text>
<line class="grid" x1="36" x2="632" y1="174.4" y2="174.4" /><text class="tick" x="30" y="178.4" text-anchor="end">10</text>
<line class="grid" x1="36" x2="632" y1="134.8" y2="134.8" /><text class="tick" x="30" y="138.8" text-anchor="end">20</text>
<line class="grid" x1="36" x2="632" y1="95.2" y2="95.2" /><text class="tick" x="30" y="99.2" text-anchor="end">30</text>
<line class="grid" x1="36" x2="632" y1="55.6" y2="55.6" /><text class="tick" x="30" y="59.6" text-anchor="end">40</text>
<line class="grid" x1="36" x2="632" y1="16.0" y2="16.0" /><text class="tick" x="30" y="20.0" text-anchor="end">50</text>
<g><title>Dez 1892: 2 Sätze</title><rect class="bar" x="48.1" y="206.1" width="30" height="7.9" rx="3" /></g>
<text class="val" x="63.1" y="200.1" text-anchor="middle">2</text>
<text class="tick" x="63.1" y="236" text-anchor="middle">Dez</text>
<g><title>Jan 1893: 33 Sätze</title><rect class="bar" x="102.3" y="83.3" width="30" height="130.7" rx="3" /></g>
<text class="val" x="117.3" y="77.3" text-anchor="middle">33</text>
<text class="tick" x="117.3" y="236" text-anchor="middle">Jan</text>
<g><title>Feb 1893: 40 Sätze</title><rect class="bar" x="156.5" y="55.6" width="30" height="158.4" rx="3" /></g>
<text class="val" x="171.5" y="49.6" text-anchor="middle">40</text>
<text class="tick" x="171.5" y="236" text-anchor="middle">Feb</text>
<g><title>Mär 1893: 43 Sätze</title><rect class="bar" x="210.6" y="43.7" width="30" height="170.3" rx="3" /></g>
<text class="val" x="225.6" y="37.7" text-anchor="middle">43</text>
<text class="tick" x="225.6" y="236" text-anchor="middle">Mär</text>
<g><title>Apr 1893: 17 Sätze</title><rect class="bar" x="264.8" y="146.7" width="30" height="67.3" rx="3" /></g>
<text class="val" x="279.8" y="140.7" text-anchor="middle">17</text>
<text class="tick" x="279.8" y="236" text-anchor="middle">Apr</text>
<g><title>Mai 1893: 45 Sätze</title><rect class="bar" x="319.0" y="35.8" width="30" height="178.2" rx="3" /></g>
<text class="val" x="334.0" y="29.8" text-anchor="middle">45</text>
<text class="tick" x="334.0" y="236" text-anchor="middle">Mai</text>
<g><title>Jun 1893: 23 Sätze</title><rect class="bar" x="373.2" y="122.9" width="30" height="91.1" rx="3" /></g>
<text class="val" x="388.2" y="116.9" text-anchor="middle">23</text>
<text class="tick" x="388.2" y="236" text-anchor="middle">Jun</text>
<text class="val" x="442.4" y="208.0" text-anchor="middle">0</text>
<text class="tick" x="442.4" y="236" text-anchor="middle">Jul</text>
<text class="val" x="496.5" y="208.0" text-anchor="middle">0</text>
<text class="tick" x="496.5" y="236" text-anchor="middle">Aug</text>
<g><title>Sep 1893: 7 Sätze</title><rect class="bar" x="535.7" y="186.3" width="30" height="27.7" rx="3" /></g>
<text class="val" x="550.7" y="180.3" text-anchor="middle">7</text>
<text class="tick" x="550.7" y="236" text-anchor="middle">Sep</text>
<g><title>Okt 1893: 1 Sätze</title><rect class="bar" x="589.9" y="210.0" width="30" height="4.0" rx="3" /></g>
<text class="val" x="604.9" y="204.0" text-anchor="middle">1</text>
<text class="tick" x="604.9" y="236" text-anchor="middle">Okt</text>
</g>
</svg>
