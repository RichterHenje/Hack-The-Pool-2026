<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 518" width="1040" height="518" role="img">
<title>Workflow: Interface Team</title>
<style>
  text { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; }
  .col { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; fill: #586b7c; }
  .src { fill: none; stroke: #9db0bf; stroke-width: 1.5; }
  .step { fill: #dfe9f0; stroke: none; }
  .sep { stroke: #9db0bf; stroke-width: 1; }
  .out { fill: #14283b; }
  .review { fill: none; stroke: #a8680f; stroke-width: 1.5; stroke-dasharray: 6 4; }
  .t { font-size: 13px; font-weight: 600; fill: #14283b; }
  .s { font-size: 11px; font-weight: 400; fill: #586b7c; }
  .t-out { font-size: 13px; font-weight: 600; fill: #f2f5f7; }
  .s-out { font-size: 11px; font-weight: 400; fill: #f2f5f7; opacity: 0.8; }
  .t-rev { font-size: 12px; font-weight: 600; fill: #a8680f; }
  .flow { fill: none; stroke: #14283b; stroke-width: 1.4; }
  .sea { fill: #f2f5f7; }
  .land { fill: #c4d3de; stroke: none; }
  .route { fill: none; stroke: #a8680f; stroke-width: 1.6; stroke-linejoin: round; }
  .dot circle { fill: #14283b; }
  .frame { fill: none; stroke: #14283b; stroke-width: 1.5; }
  .lab { font-size: 13px; fill: #14283b; }
  .val { font-size: 12px; font-weight: 600; fill: #14283b; }
  .tick { font-size: 11px; fill: #586b7c; }
  .bar, .data { fill: #1f5c8a; }
  .empty { fill: #e6edf2; }
  .grid { stroke: #d3dde5; stroke-width: 1; }
  .axis { stroke: #586b7c; stroke-width: 1; }
  .cell { font-size: 12px; font-weight: 600; fill: #14283b; }
  .cellon { font-size: 12px; font-weight: 600; fill: #f2f5f7; }
</style>
<rect width="1040" height="518" fill="#f2f5f7" />
<text x="20" y="30" style="font-family:Georgia,serif;font-size:20px;font-weight:600;fill:#14283b">Workflow: Interface Team</text>
<g transform="translate(0 44)">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="currentColor" />
          </marker>
        </defs>

        <g style="color:#14283b">
          <text class="col" x="20" y="36">1 · Input</text>
          <text class="col" x="250" y="36">2 · Storyline</text>
          <text class="col" x="510" y="36">3 · Storytelling and sources</text>
          <text class="col" x="790" y="36">4 · Prototypes</text>

          <!-- 1 Input -->
          <rect class="src" x="20" y="121" width="170" height="70" rx="3" />
          <text class="t" x="32" y="150">Cleaned data</text>
          <text class="s" x="32" y="168">from the Data Cleaning Team</text>

          <!-- 2 Storyline -->
          <rect class="step" x="250" y="70" width="200" height="172" rx="3" />
          <line class="sep" x1="266" y1="127" x2="434" y2="127" />
          <line class="sep" x1="266" y1="184" x2="434" y2="184" />
          <text class="t" x="266" y="103">Animals</text>
          <text class="t" x="266" y="160">Hunting route</text>
          <text class="t" x="266" y="217">Ship Kaiserin Elisabeth</text>

          <!-- 3 Storytelling -->
          <text class="s" x="510" y="62">Woven into the storytelling</text>
          <rect class="step" x="510" y="70" width="220" height="172" rx="3" />
          <line class="sep" x1="526" y1="127" x2="714" y2="127" />
          <line class="sep" x1="526" y1="184" x2="714" y2="184" />
          <text class="t" x="526" y="96">ANNO</text>
          <text class="s" x="526" y="113">Newspaper coverage of the trip</text>
          <text class="t" x="526" y="153">Diary of Franz Ferdinand</text>
          <text class="s" x="526" y="170">Day-by-day route and passages</text>
          <text class="t" x="526" y="210">Weltmuseum photos</text>
          <text class="s" x="526" y="227">Photos from the Weltmuseum Wien</text>

          <!-- 3 Sources -->
          <text class="s" x="510" y="274">Sources</text>
          <rect class="step" x="510" y="282" width="220" height="171" rx="3" />
          <line class="sep" x1="526" y1="339" x2="714" y2="339" />
          <line class="sep" x1="526" y1="396" x2="714" y2="396" />
          <text class="t" x="526" y="422">Historical map</text>
          <text class="s" x="526" y="439">World map 1872 (Map Warper)</text>
          <text class="t" x="526" y="308">Europeana</text>
          <text class="s" x="526" y="325">Objects from European holdings</text>
          <text class="t" x="526" y="365">Kulturpool</text>
          <text class="s" x="526" y="382">Austrian open cultural data</text>

          <!-- 4 Prototypes -->
          <rect class="out" x="790" y="90" width="230" height="80" rx="3" />
          <text class="t-out" x="806" y="126">ArcGIS prototype</text>
          <text class="s-out" x="806" y="144">Community-based</text>

          <rect class="out" x="790" y="190" width="230" height="80" rx="3" />
          <text class="t-out" x="806" y="236">Storytelling prototype</text>

          <rect class="out" x="790" y="290" width="230" height="80" rx="3" />
          <text class="t-out" x="806" y="336">Data exploration prototype</text>

          <!-- arrows -->
          <line class="flow" marker-end="url(#arr)" x1="190" y1="156" x2="250" y2="156" />
          <line class="flow" marker-end="url(#arr)" x1="450" y1="156" x2="510" y2="156" />
          <polyline class="flow" points="730,156 760,156" />
          <polyline class="flow" points="730,367 760,367" />
          <line class="flow" x1="760" y1="130" x2="760" y2="367" />
          <line class="flow" marker-end="url(#arr)" x1="760" y1="130" x2="790" y2="130" />
          <line class="flow" marker-end="url(#arr)" x1="760" y1="230" x2="790" y2="230" />
          <line class="flow" marker-end="url(#arr)" x1="760" y1="330" x2="790" y2="330" />
        </g>
      </g>
</svg>
