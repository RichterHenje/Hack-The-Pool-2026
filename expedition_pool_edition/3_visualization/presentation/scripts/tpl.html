<title>Workflow: Data Cleaning and Enrichment</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: five steps left to right (starting data, cleaning, cleaned JSON, enrichment, result), review band below */
:root {
  --bg: #f2f5f7;
  --ink: #14283b;
  --muted: #586b7c;
  --line: #9db0bf;
  --step-fill: #dfe9f0;
  --land: #c4d3de;
  --brass: #a8680f;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1a26; --ink: #e4ecf2; --muted: #93a6b6; --line: #4a6073;
    --step-fill: #1b3044; --land: #2f4a61; --brass: #e0a24a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1a26; --ink: #e4ecf2; --muted: #93a6b6; --line: #4a6073;
  --step-fill: #1b3044; --land: #2f4a61; --brass: #e0a24a;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-block: 32px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.9rem; line-height: 1.15; margin: 0; text-wrap: balance; }
figure { margin: 0; }
.scroll { overflow-x: auto; }
svg { display: block; min-width: 900px; width: 100%; height: auto; }

.col { font: 600 11px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; fill: var(--muted); }
.src { fill: none; stroke: var(--line); stroke-width: 1.5; }
.step { fill: var(--step-fill); stroke: none; }
.sep { stroke: var(--line); stroke-width: 1; }
.review { fill: none; stroke: var(--brass); stroke-width: 1.5; stroke-dasharray: 6 4; }
.t { font: 600 13px var(--font-body); fill: var(--ink); }
.s { font: 400 11px var(--font-body); fill: var(--muted); }
.t-rev { font: 600 12px var(--font-body); fill: var(--brass); }
.flow { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.sea { fill: var(--bg); }
.land { fill: var(--land); stroke: none; }
.route { fill: none; stroke: var(--brass); stroke-width: 1.6; stroke-linejoin: round; }
.dot circle { fill: var(--ink); }
.frame { fill: none; stroke: var(--ink); stroke-width: 1.5; }
</style>

<main>
  <h1>Workflow: Data Cleaning and Enrichment</h1>

  <figure>
    <div class="scroll">
      <svg viewBox="0 0 1270 480" role="img" aria-label="Five steps: starting data (vault, rank lists, diary, Höfer), cleaning and structuring, cleaned JSON data, enrichment with Wikidata, GeoNames, Kulturpool, Europeana, ANNO and TMS objects, and the result reise.html with a map excerpt of the 1892–93 voyage.">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="currentColor" />
          </marker>
        </defs>

        <g style="color: var(--ink)">
          <text class="col" x="20" y="36">1 · Starting data</text>
          <text class="col" x="230" y="36">2 · Cleaning, structuring</text>
          <text class="col" x="490" y="36">3 · Cleaned data</text>
          <text class="col" x="690" y="36">4 · Enrichment</text>
          <text class="col" x="950" y="36">5 · Result</text>

          <!-- 1 Starting data -->
          <rect class="src" x="20" y="62" width="170" height="52" rx="3" />
          <text class="t" x="32" y="84">Vault (Obsidian)</text>
          <text class="s" x="32" y="101">Places, people, ships</text>

          <rect class="src" x="20" y="138" width="170" height="52" rx="3" />
          <text class="t" x="32" y="160">Rank lists (PDFs)</text>
          <text class="s" x="32" y="177">Staff of Kaiserin Elisabeth</text>

          <rect class="src" x="20" y="214" width="170" height="52" rx="3" />
          <text class="t" x="32" y="236">Diary of F. Ferdinand</text>
          <text class="s" x="32" y="253">Internet Archive, OCR text</text>

          <rect class="src" x="20" y="290" width="170" height="52" rx="3" />
          <text class="t" x="32" y="312">Höfer 2010</text>
          <text class="s" x="32" y="329">Itinerary 1892/93</text>

          <!-- 2 Cleaning / structuring -->
          <rect class="step" x="230" y="86" width="200" height="80" rx="3" />
          <text class="t" x="244" y="110">Clean the vault</text>
          <text class="s" x="244" y="128">Fix years, links, brackets</text>
          <text class="s" x="244" y="144">Flag duplicates and anomalies</text>

          <rect class="step" x="230" y="190" width="200" height="150" rx="3" />
          <text class="t" x="244" y="214">Structure diary and</text>
          <text class="t" x="244" y="230">rank lists</text>
          <text class="s" x="244" y="252">Align OCR place names</text>
          <text class="s" x="244" y="268">Extract days, places, hunts</text>
          <text class="s" x="244" y="284">Ranks and people from lists</text>
          <text class="s" x="244" y="300">Cross-check with Höfer</text>

          <!-- 3 Cleaned data -->
          <rect class="step" x="490" y="160" width="140" height="100" rx="3" />
          <text class="t" x="504" y="205">Cleaned data</text>
          <text class="s" x="504" y="223">JSON files</text>

          <!-- 4 Enrichment -->
          <rect class="step" x="690" y="50" width="210" height="340" rx="3" />
          <line class="sep" x1="706" y1="106" x2="884" y2="106" />
          <line class="sep" x1="706" y1="160" x2="884" y2="160" />
          <line class="sep" x1="706" y1="214" x2="884" y2="214" />
          <line class="sep" x1="706" y1="268" x2="884" y2="268" />
          <line class="sep" x1="706" y1="322" x2="884" y2="322" />

          <text class="t" x="706" y="78">Wikidata</text>
          <text class="s" x="706" y="95">Authority data: people, places</text>
          <text class="t" x="706" y="132">GeoNames</text>
          <text class="s" x="706" y="149">Coordinates and place names</text>
          <text class="t" x="706" y="186">Kulturpool</text>
          <text class="s" x="706" y="203">Objects by station and period</text>
          <text class="t" x="706" y="240">Europeana</text>
          <text class="s" x="706" y="257">Objects from European holdings</text>
          <text class="t" x="706" y="294">ANNO</text>
          <text class="s" x="706" y="311">Newspaper coverage of the trip</text>
          <text class="t" x="706" y="348">TMS objects</text>
          <text class="s" x="706" y="365">Objects from KHM collections</text>

          <!-- 5 Result -->
          <text class="t" x="950" y="100">reise.html</text>
          <text class="s" x="950" y="118">Voyage 1892–93, day by day</text>
          <!--MAP-->

          <!-- arrows 1 -> 2 -->
          <polyline class="flow" marker-end="url(#arr)" points="190,88 210,88 210,110 230,110" />
          <polyline class="flow" marker-end="url(#arr)" points="190,164 210,164 210,225 230,225" />
          <line class="flow" marker-end="url(#arr)" x1="190" y1="240" x2="230" y2="240" />
          <polyline class="flow" marker-end="url(#arr)" points="190,316 210,316 210,300 230,300" />

          <!-- arrows 2 -> 3 (merge) -> 4 -> 5 -->
          <polyline class="flow" marker-end="url(#arr)" points="430,126 460,126 460,185 490,185" />
          <polyline class="flow" marker-end="url(#arr)" points="430,265 460,265 460,235 490,235" />
          <line class="flow" marker-end="url(#arr)" x1="630" y1="210" x2="690" y2="210" />
          <line class="flow" marker-end="url(#arr)" x1="900" y1="221" x2="950" y2="221" />

          <!-- review -->
          <rect class="review" x="230" y="424" width="1020" height="34" rx="3" />
          <text class="t-rev" x="246" y="445">Expert review</text>
        </g>
      </svg>
    </div>
  </figure>
</main>
